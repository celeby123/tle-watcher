name: Two Lakes Edge unit watch

on:
  schedule:
    # Backup only. The real cadence comes from the external cron-job.org
    # ping, because GitHub heavily delays scheduled runs.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | seed | test-email | debug"
        required: false
        default: "normal"

# NOTE: deliberately no `concurrency:` block. Runs arrive every 10 minutes
# and GitHub's queue can be slow, so they overlap. Cancelling the queued one
# just produces red X's. The commit step below is safe under concurrency.

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          case "$MODE" in
            seed)       python watch.py --seed ;;
            test-email) python watch.py --test-email ;;
            debug)      python watch.py --debug ;;
            *)          python watch.py ;;
          esac

      - name: Upload debug output
        if: github.event.inputs.mode == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: sightmap-payload
          path: debug/
          if-no-files-found: ignore

      # Bookkeeping must never fail the run. If this step can't push, the
      # unit check still happened and any alert was already emailed.
      - name: Commit state
        if: github.event.inputs.mode != 'debug' && github.event.inputs.mode != 'test-email'
        continue-on-error: true
        run: |
          [ -f state.json ] || exit 0
          git config user.name  "unit-watcher"
          git config user.email "actions@users.noreply.github.com"
          cp state.json /tmp/state.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/state.json state.json
            git add state.json
            if git diff --staged --quiet; then
              echo "state unchanged"; exit 0
            fi
            git commit -qm "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin main 2>/dev/null; then
              echo "state pushed (attempt $i)"; exit 0
            fi
            echo "push attempt $i lost the race, retrying"
            sleep $((i * 3))
          done
          echo "could not push state after 5 attempts — check still ran fine"
